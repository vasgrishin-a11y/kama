name: KAMA CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kama:ci .
      - name: Check container health
        shell: bash
        run: |
          docker run -d --name kama-ci -p 127.0.0.1:8080:8080 kama:ci
          trap 'docker logs kama-ci; docker rm -f kama-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
