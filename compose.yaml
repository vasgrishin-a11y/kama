services:
  kama:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAMA_PORT:-8080}:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
